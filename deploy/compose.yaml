name: sogo-ooo

services:
  ooo:
    image: ${OOO_IMAGE:-ghcr.io/entrhopi/sogo-vacation-addin:edge}
    container_name: sogo-ooo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8080'
      SOGO_BASE_URL: http://sogo:20000
      IMAP_HOST: dovecot
      IMAP_PORT: '993'
      IMAP_SECURITY: tls
    networks:
      - mailcow
    # No published ports on purpose: Mailcow's nginx proxies /ooo to this
    # container over the shared network, so the API is never exposed directly.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  mailcow:
    external: true
    name: ${MAILCOW_NETWORK:-mailcow_mailcow-network}
